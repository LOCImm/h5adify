[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h5adify"
version = "0.1.0"
description = "Download, normalize metadata, and convert public sc/snRNA-seq + spatial datasets to standardized .h5ad (AnnData)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="h5adify contributors"}]
keywords = ["single-cell", "spatial", "anndata", "h5ad", "GEO", "cellxgene"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "anndata>=0.10.7",
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.10",
  "requests>=2.31",
  "tqdm>=4.66",
  "GEOparse>=2.0.4",
  "scanpy>=1.9.8",
  "h5py>=3.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "packaging>=23.2",
]

[project.optional-dependencies]
sodb = ["pysodb @ git+https://github.com/TencentAILabHealthcare/pysodb.git"]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8"]
docs = [
  "sphinx>=7.2",
  "myst-parser>=2.0",
  "sphinx-rtd-theme>=2.0",
]

[project.scripts]
h5adify = "h5adify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
