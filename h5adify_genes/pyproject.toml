[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h5adify"
version = "0.2.0"
description = "Download, standardize and inspect single-cell/spatial datasets as .h5ad."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "h5adify contributors"}]
dependencies = [
  "requests>=2.31",
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "anndata>=0.9",
  "h5py>=3.8",
  "tqdm>=4.66",
  "GEOparse>=2.0.3",
]

[project.optional-dependencies]
dev = ["black>=24.0", "ruff>=0.5", "pytest>=8.0"]
sodb = ["sodb>=0.1.1"]
scp = []
genes = []

[project.scripts]
h5adify = "h5adify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
